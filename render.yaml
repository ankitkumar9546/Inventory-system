databases:
  - name: overseeflow-db
    databaseName: inventory_db
    user: inventory_user

services:
  - type: web
    name: overseeflow-api
    env: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: overseeflow-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
